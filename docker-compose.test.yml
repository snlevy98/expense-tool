# Throwaway Postgres for the backend test suite — NEVER points at Supabase.
#
#   docker compose -f docker-compose.test.yml up -d   # start (waits ~2s to be healthy)
#   cd backend && python -m pytest                     # run tests
#   docker compose -f docker-compose.test.yml down     # stop + discard
#
# Data lives in tmpfs (RAM), so the DB is empty on every `up` and nothing
# survives a `down`. Exposed on host port 5433 to avoid clashing with any
# local Postgres on 5432. Override the URL the tests use with TEST_DATABASE_URL.
services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expense_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_test"]
      interval: 2s
      timeout: 3s
      retries: 20
